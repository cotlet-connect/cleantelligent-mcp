[project]
name = "cleantelligent-mcp"
version = "1.1.0"
description = "Connect CleanTelligent to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No CleanTelligent API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["cleantelligent", "cleantelligent api", "cleantelligent mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/cleantelligent?utm_source=pypi&utm_medium=package&utm_campaign=cleantelligent"
Source = "https://github.com/cotlet-connect/cleantelligent-mcp"

[project.scripts]
cleantelligent-mcp = "cleantelligent_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"cleantelligent_agent.py" = "cleantelligent_agent.py"

[tool.hatch.build.targets.sdist]
include = ["cleantelligent_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
